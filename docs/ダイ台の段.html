<h1>台は下へ行くほど太くなります</h1>
<p>ダイの下は一本の柱ではなく、<b>三段の階段</b>です。段のたびに幅が広がります。</p>

<table><tr><th>部分</th><th>幅</th><th>その幅で入れる深さ</th></tr>
<tr><td>インサート（刃）</td><td>16mm</td><td>45mm</td></tr>
<tr><td>ホルダ</td><td>25mm</td><td>50mm</td></tr>
<tr><td>ベッド</td><td>60mm</td><td>96.5mm</td></tr></table>
<p>板を下へ垂らしたとき、<b>どの段に載るかで入る深さが変わります</b>。だからフランジAの上限が段差Sで変わる、というお話と形が合います。</p>
<p class="warn">シミュレーションは V12・V16・V20 で、段差を変えても 97 前後（いちばん深い段）しか返しません。浅い段を見ていません。</p>
